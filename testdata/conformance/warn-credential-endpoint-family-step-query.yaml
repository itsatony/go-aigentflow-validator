aigentflow_version: '2.0.0'
name: credential-endpoint-family-step-query
version: '1.0.0'
description: >-
  A step whose secret is a server variable its plugin expands, beside a literal endpoint that is
  not the family's default (AIgentFlow DC-FORGE-233, credential_endpoint_unpaired). The
  server's key is only ever sent to the executor's default or deployment-configured endpoint.
  A default's HOST on another port is another origin.
start: vectors
steps:
  vectors:
    executor: db://weaviate/search
    query:
      api_key: '${AIGENTFLOW_DB_PINECONE_API_KEY}'
      base_url: 'https://vectors.example.com'
    next:
      default: broker
  broker:
    executor: mqtt://broker/publish
    query:
      password: '${AIGENTFLOW_MQTT_PASSWORD}'
      broker_url: 'tcp://localhost:1884'
      topic: 't'
    next:
      default: rounds
  rounds:
    loop:
      while: '{{ lt .loop.index 1 }}'
      max_iterations: 1
      steps:
        - id: map
          executor: staticmap://geoapify/render
          query:
            api_key: '${AIGENTFLOW_GEOAPIFY_API_KEY}'
            base_url: 'https://maps.example.com/v1'
    next:
      default: 'null'
output:
  - rounds
