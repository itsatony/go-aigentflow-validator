aigentflow_version: '2.0.0'
name: invalid-orchestrator-removed-block
version: '1.0.0'
description: >-
  AIgentFlow 2.838.0 removed the orchestrator. A well-formed orchestrator: block
  is refused whole as orchestrator_removed, once, at the field orchestrator.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: mission_started
    - type: timer
      interval: 30s
  tools:
    - aif_step_inspect
    - aif_mission_complete
output:
  - message
