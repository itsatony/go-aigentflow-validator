aigentflow_version: '2.0.0'
name: next-end-names-a-step
version: '1.0.0'
description: >-
  `end` is an ordinary step id. When a step of that name exists, routing to it
  saves. The reference's reachability walk still stops at `end`, so the step is
  reported unreachable (a warning) by the reference and by this validator alike.
  'null' (quoted or a YAML null) and an empty default also finish a flow.
start: work
steps:
  work:
    executor: mock://api/work
    next:
      conditions:
        - if: '{{ eq .query.mode "stop" }}'
          goto: 'null'
      default: end
  end:
    executor: mock://api/end
    next:
      default:
output:
  - ok
