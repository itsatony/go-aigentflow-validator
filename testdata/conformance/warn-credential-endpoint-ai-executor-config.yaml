aigentflow_version: '2.0.0'
name: credential-endpoint-ai-executor-config
version: '1.0.0'
description: >-
  A literal executor_config.<provider>.base_url with no literal key of the flow's own beside it
  (AIgentFlow DC-FORGE-231, credential_endpoint_unpaired): the server's own key (an env
  reference) and no key at all both warn, even when no step uses the provider, and so does a
  block whose steps do not all bring their own key.
executor_config:
  openai:
    api_key: '${AIGENTFLOW_OPENAI_API_KEY}'
    base_url: 'https://llm.example.com/v1'
  mistral:
    base_url: 'https://mistral.example.com'
  anthropic:
    base_url: 'https://claude.example.com'
start: chat
steps:
  chat:
    executor: ai://openai/chat
    query:
      prompt: 'hi'
    next:
      default: mixed_own
  mixed_own:
    executor: ai://anthropic/chat
    query:
      prompt: 'hi'
      anthropic_api_key: '{{ .query.key }}'
    next:
      default: mixed_stored
  mixed_stored:
    executor: ai://anthropic/chat
    query:
      prompt: 'hi'
    next:
      default: 'null'
query:
  key:
    type: string
output:
  - mixed_stored
