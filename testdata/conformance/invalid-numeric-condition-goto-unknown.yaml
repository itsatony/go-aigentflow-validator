aigentflow_version: '2.0.0'
name: numeric-condition-goto-unknown
version: '1.0.0'
description: >-
  A condition's goto written as a number names the step "7". None exists, so the
  flow is refused.
start: fetch
steps:
  fetch:
    executor: mock://api/fetch
    next:
      conditions:
        - if: '{{ eq .data.fetch.status "ok" }}'
          goto: 7
      default: 'null'
output:
  - ok
