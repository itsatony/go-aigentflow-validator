aigentflow_version: '2.0.0'
name: executor-here
version: '1.0.0'
description: >-
  The here:// map executor (geocode, reverse_geocode, route, places) is a known
  scheme. No unknown_executor_scheme warning may appear.
start: locate
steps:
  locate:
    executor: here://maps/geocode
    query:
      q: 'Alexanderplatz, Berlin'
    next:
      default: 'null'
output:
  - locate
