aigentflow_version: '2.0.0'
name: credential-endpoint-keyless-providers
version: '1.0.0'
description: >-
  ollama and vllm are exempt from credential_endpoint_unpaired: an endpoint without a key is
  their normal, self-hosted configuration (counter-fixture).
executor_config:
  ollama:
    base_url: 'http://gpu.example.com:11434/v1'
  vllm:
    base_url: 'http://gpu.example.com:8000/v1'
start: local
steps:
  local:
    executor: ai://ollama/chat
    query:
      prompt: 'hi'
      ollama_base_url: 'http://gpu.example.com:11434/v1'
    next:
      default: served
  served:
    executor: ai://vllm/chat
    query:
      prompt: 'hi'
      vllm_base_url: 'http://gpu.example.com:8000/v1'
    next:
      default: 'null'
output:
  - served
