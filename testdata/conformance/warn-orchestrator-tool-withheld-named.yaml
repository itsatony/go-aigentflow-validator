aigentflow_version: '2.0.0'
name: orchestrator-tool-withheld-named
version: '1.0.0'
description: >-
  aif_step_start is named in orchestrator.tools and omitted by tools.allow, so it is never
  offered. The lifecycle tool and the signal tool named beside it are exempt from tools.allow
  (signals are enabled by default), and aif_ask_human is allowed.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  tools: [aif_step_start, aif_mission_complete, aif_signal_complete, aif_ask_human]
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
