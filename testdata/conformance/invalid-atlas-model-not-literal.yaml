aigentflow_version: '2.0.0'
name: invalid-atlas-model-not-literal
version: '1.0.0'
description: >-
  The model an atlas agent runs on is fixed in the flow, never computed from input.
start: s
steps:
  s:
    executor: atlas://agent/run
    query:
      agent: '@acme/reporter'
      prompt: hello
      model:
        provider: anthropic
        model: '{{ .query.model }}'
    next:
      default: 'null'
output:
  - done
