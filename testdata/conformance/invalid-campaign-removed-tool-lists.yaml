aigentflow_version: '2.0.0'
name: invalid-campaign-removed-tool-lists
version: '1.0.0'
description: >-
  A removed campaign tool in orchestrator.tools, deny_tools, require_approval_for or the
  definition's tools.allow is campaign_removed once per list, never an unknown or withheld tool.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  tools: [aif_ask_human, aif_campaign_spawn, aif_campaign_status]
  deny_tools: [aif_campaign_cancel]
  require_approval_for: [aif_campaign_spawn]
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human, aif_campaign_results]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
