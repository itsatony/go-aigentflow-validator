aigentflow_version: '2.0.0'
name: invalid-flow-modification-removed-trigger
version: '1.0.0'
description: >-
  The dfm_suggestion trigger was removed with dynamic flow modification in 2.834.0. It is refused
  as flow_modification_removed, never as an unknown trigger.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
    - type: dfm_suggestion
    - type: dfm_suggestion
output:
  - message
