aigentflow_version: '2.0.0'
name: credential-endpoint-ai-loop-sub-step
version: '1.0.0'
description: >-
  A loop sub-step is scanned too, addressed by its id (AIgentFlow DC-FORGE-231,
  credential_endpoint_unpaired). The first sub-step brings its own key and does not warn.
start: rounds
steps:
  rounds:
    loop:
      while: '{{ lt .loop.index 2 }}'
      max_iterations: 2
      steps:
        - id: own
          executor: ai://openai/chat
          query:
            prompt: 'draft'
            api_key: '{{ .query.key }}'
            openai_base_url: 'https://llm.example.com/v1'
        - id: stored
          executor: ai://openai/chat
          query:
            prompt: '{{ .data.own.content }}'
            openai_base_url: 'https://llm.example.com/v1'
    next:
      default: 'null'
query:
  key:
    type: string
output:
  - rounds
