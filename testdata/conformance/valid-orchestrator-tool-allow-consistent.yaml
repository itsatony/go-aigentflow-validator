aigentflow_version: '2.0.0'
name: orchestrator-tool-allow-consistent
version: '1.0.0'
description: >-
  Every tool orchestrator.tools names passes tools.allow or is exempt (a lifecycle tool), so nothing
  is withheld.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  tools: [aif_step_start, aif_mission_fail]
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_step_start]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
