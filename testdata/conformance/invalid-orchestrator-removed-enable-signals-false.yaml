aigentflow_version: '2.0.0'
name: invalid-orchestrator-removed-enable-signals-false
version: '1.0.0'
description: >-
  orchestrator.enable_signals false used to be a removed_key_ignored warning.
  The block is refused whole since 2.838.0, so the only finding is the
  orchestrator_removed error: no warning for a key inside it.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  enable_signals: false
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
output:
  - message
