aigentflow_version: '2.0.0'
name: credential-endpoint-server-endpoints
version: '1.0.0'
description: >-
  A server credential beside an endpoint that is not certainly the author's never warns
  (credential_endpoint_unpaired counter-fixture): the family's default endpoint (compared by
  origin, so case, the default port and a path do not matter), a deployment variable, a
  templated endpoint, and no endpoint at all.
executor_config:
  openai:
    api_key: '${AIGENTFLOW_OPENAI_API_KEY}'
    base_url: '${AIGENTFLOW_OPENAI_BASE_URL}'
start: research
steps:
  research:
    executor: deepr://deepr/stats
    query:
      api_key: '${AIGENTFLOW_DEEPR_API_KEY}'
      base_url: 'HTTP://LocalHost:28081/api/v1/'
    next:
      default: map
  map:
    executor: staticmap://geoapify/render
    query:
      api_key: '${AIGENTFLOW_GEOAPIFY_API_KEY}'
      base_url: 'https://maps.geoapify.com:443/v1/staticmap'
    next:
      default: broker
  broker:
    executor: mqtt://broker/publish
    query:
      password: '${AIGENTFLOW_MQTT_PASSWORD}'
      broker_url: 'tcp://localhost:1883'
      topic: 't'
    next:
      default: vectors
  vectors:
    executor: db://qdrant/search
    query:
      api_key: '${AIGENTFLOW_DB_PINECONE_API_KEY}'
      base_url: '${AIGENTFLOW_DB_QDRANT_BASE_URL}'
    next:
      default: templated
  templated:
    executor: db://weaviate/search
    query:
      api_key: '${AIGENTFLOW_DB_PINECONE_API_KEY}'
      base_url: '{{ .query.endpoint }}'
    next:
      default: home
  home:
    executor: homeassistant://api/get_states
    query:
      token: '${AIGENTFLOW_HOMEASSISTANT_TOKEN}'
    next:
      default: chat
  chat:
    executor: ai://openai/chat
    query:
      prompt: 'hi'
    next:
      default: 'null'
query:
  endpoint:
    type: string
output:
  - chat
