aigentflow_version: '2.0.0'
name: credential-endpoint-ai-step-query
version: '1.0.0'
description: >-
  An ai:// step whose query names <provider>_base_url while the flow supplies no key of its own
  for that provider: at run time the org's (or the platform's) stored key is never sent to a
  host the flow chooses (AIgentFlow DC-FORGE-231, credential_endpoint_unpaired). A literal and a
  templated endpoint both warn, and a key for ANOTHER provider is not a key for this one.
start: literal
steps:
  literal:
    executor: ai://openai/chat
    query:
      prompt: 'hi'
      openai_base_url: 'https://llm.example.com/v1'
    next:
      default: templated
  templated:
    executor: ai://anthropic/chat
    query:
      prompt: 'hi'
      anthropic_base_url: '{{ .query.endpoint }}'
    next:
      default: other_key
  other_key:
    executor: ai://mistral/chat
    query:
      prompt: 'hi'
      openai_api_key: '{{ .query.key }}'
      mistral_base_url: 'https://mistral.example.com'
    next:
      default: 'null'
query:
  endpoint:
    type: string
  key:
    type: string
output:
  - other_key
