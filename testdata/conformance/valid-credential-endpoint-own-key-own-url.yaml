aigentflow_version: '2.0.0'
name: credential-endpoint-own-key-own-url
version: '1.0.0'
description: >-
  The author's own key to the author's own host is legitimate and never warns
  (credential_endpoint_unpaired counter-fixture): a step key (generic or per provider, literal
  or templated), a literal executor_config key, every step of a provider bringing its own key,
  a family secret of the author's own, and a nexus key or credentials mapping.
executor_config:
  openai:
    api_key: 'sk-own'
    base_url: 'https://llm.example.com/v1'
  anthropic:
    base_url: 'https://claude.example.com'
  mistral:
    api_key: '{{ .query.key }}'
start: generic
steps:
  generic:
    executor: ai://openai/chat
    query:
      prompt: 'hi'
      openai_base_url: 'https://llm.example.com/v1'
    next:
      default: claude
  claude:
    executor: ai://anthropic/chat
    query:
      prompt: 'hi'
      api_key: '{{ .query.key }}'
      anthropic_base_url: 'https://claude.example.com'
    next:
      default: claude_again
  claude_again:
    executor: ai://anthropic/chat
    query:
      prompt: 'hi'
      anthropic_api_key: 'sk-own'
    next:
      default: mistral
  mistral:
    executor: ai://mistral/chat
    query:
      prompt: 'hi'
      mistral_base_url: 'https://mistral.example.com'
    next:
      default: vectors
  vectors:
    executor: db://weaviate/search
    query:
      api_key: '{{ .query.key }}'
      base_url: 'https://vectors.example.com'
    next:
      default: broker
  broker:
    executor: mqtt://broker/publish
    query:
      password: 'own-password'
      broker_url: 'tcp://mqtt.example.com:1883'
      topic: 't'
    next:
      default: agent
  agent:
    executor: nexus://org/agent
    query:
      message: 'hi'
      api_key: 'own-key'
      base_url: 'https://chat.example.com'
    next:
      default: agent_map
  agent_map:
    executor: nexus://org/agent
    query:
      message: 'hi'
      credentials:
        chat: 'stored/nexus/own'
      base_url: 'https://chat.example.com'
    next:
      default: 'null'
query:
  key:
    type: string
output:
  - agent_map
