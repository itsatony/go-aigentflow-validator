aigentflow_version: '2.0.0'
name: numeric-parallel-member
version: '1.0.0'
description: >-
  next.parallel.steps is a Go []string in the reference, so a member written as
  a number is the step of that text, and a rendezvous written as a number is
  too. Both exist; the flow saves and every step is reachable.
start: fan
steps:
  fan:
    executor: mock://api/fan
    next:
      parallel:
        steps: [1]
        rendezvous: 3
  1:
    executor: mock://api/branch
  3:
    executor: mock://api/join
    next:
      default: 'null'
output:
  - ok
