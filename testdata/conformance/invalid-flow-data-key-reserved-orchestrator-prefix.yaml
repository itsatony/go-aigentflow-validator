aigentflow_version: '2.0.0'
name: flow-data-key-reserved-orchestrator-prefix
version: '1.0.0'
description: >-
  A top-level data: key `orchestrator.state` names engine state and is refused (flow_data_key_reserved).
start: only
data:
  'orchestrator.state': 'x'
steps:
  only:
    executor: function://utils/log
    next:
      default: 'null'
