aigentflow_version: '2.0.0'
name: invalid-signal-removed-enable-signals
version: '1.0.0'
description: >-
  orchestrator.enable_signals: true asks for the signal tools AIgentFlow removed in 2.834.0.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  enable_signals: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
