aigentflow_version: '2.0.0'
name: orchestrator-exons-no-provider
version: '1.0.0'
description: >-
  An orchestrator's exons spec must set execution.provider.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
