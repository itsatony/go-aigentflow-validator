aigentflow_version: '2.0.0'
name: invalid-signal-removed-tool-lists
version: '1.0.0'
description: >-
  A removed signal tool named in orchestrator.tools, deny_tools, require_approval_for or the
  definition's tools.allow is refused once per list as signal_removed, never as an unknown or a
  withheld tool.
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  tools: [aif_ask_human, aif_signal_complete, aif_signal_need_human, aif_signal_complete]
  deny_tools: [aif_signal_delegate]
  require_approval_for: [aif_signal_modify_flow]
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human, aif_signal_need_tool]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
