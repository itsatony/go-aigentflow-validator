aigentflow_version: '2.0.0'
name: monitor-orchestrator
version: '1.0.0'
description: A self-terminating DAG monitored by a monitor-mode orchestrator (DC-COND-1).
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
