aigentflow_version: '2.0.0'
name: invalid-catalog-loop-substep-flow-version
version: '1.0.0'
description: >-
  A misplaced flow_version is an error in a loop body too.
start: repeat
steps:
  repeat:
    loop:
      while: '{{ lt .loop.iteration 1 }}'
      max_iterations: 2
      steps:
        - id: ask
          executor: ai://openai/chat
          flow_version: '1.0.0'
          query:
            prompt: hello
    next:
      default: 'null'
output:
  - done
