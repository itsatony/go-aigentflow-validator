aigentflow_version: '2.0.0'
name: credential-endpoint-not-judged
version: '1.0.0'
description: >-
  Shapes credential_endpoint_unpaired does not judge statically (counter-fixture): a family
  whose client carries an implicit service credential (a deployment property), a plugin that
  never expands an env reference (the literal string is no server secret), a step that sends
  no credential, a server variable of ANOTHER family, a non-string endpoint, a base_url key on
  a non-ai step, and an executor_config block that names no AI provider.
executor_config:
  lookup:
    base_url: 'https://lookup.example.com'
start: markdown
steps:
  markdown:
    executor: getmd://getmd/health
    query:
      base_url: 'https://md.example.com'
    next:
      default: trove
  trove:
    executor: storage://trove/upload
    query:
      trove_base_url: 'https://trove.example.com'
    next:
      default: plug
  plug:
    executor: shelly://device/status
    query:
      auth_key: '${AIGENTFLOW_SHELLY_AUTH_KEY}'
      device_ip: '10.0.0.9'
    next:
      default: tools
  tools:
    executor: mcp://http/discover
    query:
      auth_token: '${AIGENTFLOW_MCP_AUTH_TOKEN}'
      server_url: 'https://mcp.example.com/mcp'
    next:
      default: public_tools
  public_tools:
    executor: mcp://http/discover
    query:
      server_url: 'https://public-mcp.example.com/mcp'
    next:
      default: wrong_family
  wrong_family:
    executor: deepr://deepr/stats
    query:
      api_key: '${AIGENTFLOW_DB_PINECONE_API_KEY}'
      base_url: 'https://research.example.com'
    next:
      default: numeric
  numeric:
    executor: db://weaviate/search
    query:
      api_key: '${AIGENTFLOW_DB_PINECONE_API_KEY}'
      base_url: 8080
    next:
      default: plain_http
  plain_http:
    executor: http://api/get
    query:
      url: 'https://api.example.com'
      openai_base_url: 'https://llm.example.com/v1'
    next:
      default: 'null'
output:
  - plain_http
