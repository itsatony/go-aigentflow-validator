aigentflow_version: '2.0.0'
name: invalid-function-operation-unknown-loop-substep
version: '1.0.0'
description: >-
  The same refusal applies to a loop sub-step executor.
start: looper
steps:
  looper:
    loop:
      while: '{{ lt (atoi .loop.vars.counter) 2 }}'
      max_iterations: 3
      vars:
        counter: '0'
      steps:
        - id: body
          executor: function://notify/send
          query:
            message: hello
          post_processing:
            - loop.set:
                counter: '{{ add (atoi .loop.vars.counter) 1 }}'
    next:
      default: 'null'
output:
  - done
