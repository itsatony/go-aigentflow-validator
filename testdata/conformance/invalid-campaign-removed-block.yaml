aigentflow_version: '2.0.0'
name: invalid-campaign-removed-block
version: '1.0.0'
description: >-
  Campaigns were removed in 2.836.0. The campaign: block is refused whole as campaign_removed;
  none of the old campaign rules run on its contents (on_children_complete names no step
  here, and max_credits_per_child is negative).
start: coordinate
steps:
  coordinate:
    executor: function://utils/log
    query:
      message: 'coordinating'
    next:
      default: 'null'
campaign:
  child_flows:
    - alias: expert
  max_credits_per_child: -1
  on_children_complete: no_such_step
