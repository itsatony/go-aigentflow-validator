aigentflow_version: '2.0.0'
name: invalid-agentic-param-removed
version: '1.0.0'
description: >-
  An ai:// step that turns on the removed agent loop: one finding names every removed key.
start: s
steps:
  s:
    executor: ai://anthropic/chat
    query:
      prompt: research this
      agentic: true
      max_tool_turns: 8
      mcp_server_url: https://mcp.example.com/sse
    next:
      default: 'null'
output:
  - done
