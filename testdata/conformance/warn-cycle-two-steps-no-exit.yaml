aigentflow_version: '2.0.0'
name: warn-cycle-two-steps-no-exit
version: '1.0.0'
description: >-
  Two steps that route only to each other can never leave the cycle.
start: a
steps:
  a:
    executor: function://utils/log
    query:
      message: 'a'
    next:
      default: b
  b:
    executor: function://utils/log
    query:
      message: 'b'
    next:
      default: a
output:
  - message
