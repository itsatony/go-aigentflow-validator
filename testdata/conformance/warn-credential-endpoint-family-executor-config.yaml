aigentflow_version: '2.0.0'
name: credential-endpoint-family-executor-config
version: '1.0.0'
description: >-
  The secret or the endpoint can come from the family's executor_config block (AIgentFlow
  DC-FORGE-233, credential_endpoint_unpaired): its api_key or base_url when the family copies
  them into its secret or endpoint parameter, else the parameter under extra. The step query
  wins where both are set.
executor_config:
  deepr:
    api_key: '${AIGENTFLOW_DEEPR_API_KEY}'
  api:
    base_url: 'https://home.example.com'
  s3:
    extra:
      secret_access_key: '${AIGENTFLOW_STORAGE_S3_SECRET_KEY}'
      endpoint: 'https://objects.example.com'
start: research
steps:
  research:
    executor: deepr://deepr/stats
    query:
      base_url: 'https://research.example.com'
    next:
      default: home
  home:
    executor: homeassistant://api/get_states
    query:
      token: '${AIGENTFLOW_HOMEASSISTANT_TOKEN}'
    next:
      default: upload
  upload:
    executor: storage://s3/upload
    query:
      key: 'a.txt'
    next:
      default: 'null'
output:
  - upload
