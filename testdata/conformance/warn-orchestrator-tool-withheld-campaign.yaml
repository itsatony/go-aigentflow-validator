aigentflow_version: '2.0.0'
name: orchestrator-tool-withheld-campaign
version: '1.0.0'
description: >-
  The flow declares a campaign, and tools.allow names none of the campaign tools, so no child
  mission can be spawned or tracked.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
campaign:
  child_flows:
    - flow_name: expert-unit
  max_concurrent: 3
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
