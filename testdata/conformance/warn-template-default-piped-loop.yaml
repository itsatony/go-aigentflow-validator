aigentflow_version: '2.0.0'
name: template-default-piped-loop
version: '1.0.0'
description: >-
  A piped `default` inside a loop body is a warning, not an error: positional,
  exactly like template_syntax_error. The code survives the demotion.
start: looper
steps:
  looper:
    loop:
      while: 'true'
      max_iterations: 3
      vars:
        counter: '0'
      steps:
        - id: body
          executor: function://utils/log
          query:
            message: '{{ .query.x | default "w" }}'
    next:
      default: 'null'
output:
  - done
