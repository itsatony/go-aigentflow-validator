aigentflow_version: '2.0.0'
name: orchestrator-exons-no-spec
version: '1.0.0'
description: >-
  An orchestrator document must declare a frontmatter spec: with none (or an empty one) the
  reference's parse yields no spec and refuses the flow. The built-in reader decides this too.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    Observe the mission and report.
  triggers:
    - type: step_completed
output:
  - message
