aigentflow_version: '2.0.0'
name: function-operation-builtins
version: '1.0.0'
description: Real built-in operations, including a three-segment one.
start: first
steps:
  first:
    executor: function://utils/log
    query:
      message: hi
    next:
      default: second
  second:
    executor: function://text/count-words
    query:
      text: hello world
    next:
      default: third
  third:
    executor: function://binary-processor/validate-and-store
    query:
      x: y
    next:
      default: 'null'
output:
  - done
