aigentflow_version: '2.0.0'
name: compliance-residency-unenforced
version: '1.0.0'
description: >-
  AIgentFlow v2.821.0. An EU-only compliance.residency is a catalogue eligibility
  check, not endpoint evidence, so a literal call on a provider whose default
  endpoint commits to no jurisdiction (openai, mistral) that sets neither region
  nor enforce_region draws compliance_residency_unenforced. A provider with no
  region lane (anthropic) is never warned. A warning, never an error: the flow stays valid.
compliance:
  residency: ['EU']
start: ask_openai
steps:
  ask_openai:
    executor: ai://openai/chat
    query:
      model: gpt-5
      prompt: 'hi'
    next:
      default: ask_mistral
  ask_mistral:
    executor: ai://mistral/chat
    query:
      model: mistral-large-latest
      prompt: 'hi'
    next:
      default: ask_anthropic
  ask_anthropic:
    executor: ai://anthropic/chat
    query:
      model: claude-sonnet-4-6
      prompt: 'hi'
    next:
      default: 'null'
