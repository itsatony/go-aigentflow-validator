aigentflow_version: '2.0.0'
name: orchestrator-tool-withheld-signals-off
version: '1.0.0'
description: >-
  With enable_signals: false the signal tools lose their exemption, so a signal tool named in
  orchestrator.tools and omitted by tools.allow is withheld.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  enable_signals: false
  tools: [aif_signal_complete]
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
