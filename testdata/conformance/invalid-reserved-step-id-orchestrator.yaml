aigentflow_version: '2.0.0'
name: reserved-step-id-orchestrator
version: '1.0.0'
description: >-
  A top-level step may not be called 'orchestrator'. The id stays reserved after
  the orchestrator was removed (AIgentFlow 2.838.0), so `next: orchestrator` can
  only ever mean the removed hand-over. The check is case-sensitive, so
  'Orchestrator' below is legal.
start: Orchestrator
steps:
  Orchestrator:
    executor: function://utils/log
    query:
      message: 'legal: the check is case-sensitive'
    next:
      default: 'null'
  orchestrator:
    executor: function://utils/log
    query:
      message: 'refused'
    next:
      default: 'null'
output:
  - message
