aigentflow_version: "2.0.0"
name: crm_lookup
description: "Looks a customer up in a CRM."
version: "1.0.0"
start: lookup
input_schema:
  version: 1
  fields:
    - { name: customer, type: string, label: "Customer", required: true }
    - { name: crm_token, type: secret, label: "CRM token", required: true }
output: [summary]
steps:
  lookup:
    executor: "ai://anthropic/chat"
    query:
      model: "claude-sonnet-5-5"
      messages:
        - role: user
          content: "Summarise {{ .query.customer }}"
    post_processing:
      - output.set:
          summary: "{{ .step.response.content }}"
    next:
      default: "null"
examples:
  - id: known_customer
    title: "A customer the CRM knows"
    guidance: "The required secret is left out on purpose; the person running the check supplies it."
    input:
      customer: "Mueller GmbH"
    expected:
      rubric: "A two-sentence summary of the account."
    variants:
      - id: no_token_still
        origin: author
        input_patch:
          crm_token: null
          customer: "Schmidt AG"
