aigentflow_version: '2.0.0'
name: orchestrator-tool-allow-campaign
version: '1.0.0'
description: >-
  One campaign tool in tools.allow is enough for the campaign warning, and aif_ask_human is
  allowed.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
campaign:
  child_flows:
    - flow_name: expert-unit
  max_concurrent: 3
orchestrator:
  mode: monitor
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    tools:
      allow: [aif_ask_human, aif_campaign_status]
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
