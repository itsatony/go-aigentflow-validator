aigentflow_version: '2.0.0'
name: invalid-executor-removed-exons
version: '1.0.0'
description: >-
  A top-level step on the removed exons:// scheme: executor_removed and nothing else.
start: s
steps:
  s:
    executor: exons://agent/execute
    query:
      exons: |
        ---
        name: helper
        description: helps
        type: agent
        execution:
          provider: anthropic
        ---
        {~exons.message role="system"~}help{~/exons.message~}
    next:
      default: 'null'
output:
  - done
