aigentflow_version: '2.0.0'
name: credential-endpoint-nexus
version: '1.0.0'
description: >-
  nexus:// (and its alias aigentchat://) is judged like ai:// (AIgentFlow DC-FORGE-233,
  credential_endpoint_unpaired): the resolver plans a stored key for every step, so an endpoint
  with no key of the flow's own beside it can only be paired with a stored key. Templated or
  not, it warns.
start: agent
steps:
  agent:
    executor: nexus://org/agent
    query:
      message: 'hi'
      base_url: 'https://chat.example.com'
    next:
      default: alias
  alias:
    executor: aigentchat://org/agent
    query:
      message: 'hi'
      aigentchat_base_url: '{{ .query.endpoint }}'
    next:
      default: 'null'
query:
  endpoint:
    type: string
output:
  - alias
