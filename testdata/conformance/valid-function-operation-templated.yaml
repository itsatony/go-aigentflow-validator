aigentflow_version: '2.0.0'
name: function-operation-templated
version: '1.0.0'
description: A templated executor is rendered before dispatch and cannot be judged statically.
start: first
steps:
  first:
    executor: 'function://{{ .query.op }}'
    query:
      message: hi
    next:
      default: 'null'
output:
  - done
