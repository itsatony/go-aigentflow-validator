aigentflow_version: '2.0.0'
name: invalid-agentic-param-removed-null-value
version: '1.0.0'
description: >-
  A null value does not excuse a removed key (guardrails and timeout_seconds here).
start: s
steps:
  s:
    executor: ai://openai/chat
    query:
      prompt: hello
      guardrails:
      timeout_seconds:
    next:
      default: 'null'
output:
  - done
