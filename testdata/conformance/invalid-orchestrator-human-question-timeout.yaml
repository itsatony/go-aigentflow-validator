aigentflow_version: '2.0.0'
name: bad-human-question-timeout
version: '1.0.0'
description: >
  AIF v2.695.0 (DC-FORGE-125, aigentflow#124). A negative per-question HITL
  deadline. It is a WELL-FORMED Go duration, so a bare isValidGoDuration check
  accepts it — and the reference parser refuses it, because a deadline in the
  past is not a deadline.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  agentic: true
  human_question_timeout: '-5m'
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
