aigentflow_version: '2.0.0'
name: invalid-atlas-operation-unknown
version: '1.0.0'
description: >-
  An atlas:// step whose provider is neither agent nor capability is refused.
start: s
steps:
  s:
    executor: atlas://tool/run
    query:
      agent: '@acme/reporter'
      prompt: hello
    next:
      default: 'null'
output:
  - done
