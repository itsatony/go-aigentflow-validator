aigentflow_version: '2.0.0'
name: valid-atlas-capability-args-templated
version: '1.0.0'
description: >-
  A capability step may take templated args.
start: s
steps:
  s:
    executor: atlas://capability/calc_evaluate
    query:
      args:
        expression: '{{ .query.expression }}'
    next:
      default: 'null'
output:
  - done
