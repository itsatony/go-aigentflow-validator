aigentflow_version: '2.0.0'
name: invalid-atlas-skills-not-literal
version: '1.0.0'
description: >-
  The skills an agent run starts with are written into the flow, never computed from input.
start: s
steps:
  s:
    executor: nexus://agent/run
    query:
      agent: '@acme/reporter'
      prompt: hello
      skills:
        - '@acme/monthly-report'
        - '{{ .query.skill }}'
    next:
      default: 'null'
output:
  - done
