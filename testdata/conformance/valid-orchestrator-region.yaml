aigentflow_version: '2.0.0'
name: orchestrator-region-eu
version: '1.0.0'
description: An orchestrator pinned to a region and enforcing it.
start: work
steps:
  work:
    executor: function://text/template
    query:
      message: 'working'
    next:
      default: 'null'
orchestrator:
  mode: monitor
  region: eu
  enforce_region: true
  agentic: true
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
  triggers:
    - type: step_completed
output:
  - message
