aigentflow_version: '2.0.0'
name: removed-executor-nexus
version: '1.0.0'
description: >-
  nexus:// and aigentchat:// were removed from AIgentFlow in v2.819.0. The reference never
  rejects on scheme, so this library treats them like any scheme it does not know: an
  unknown_executor_scheme WARNING, and nothing else. In particular the credential-endpoint rule
  (credential_endpoint_unpaired) no longer judges them.
start: agent
steps:
  agent:
    executor: nexus://org/agent
    query:
      message: 'hi'
      base_url: 'https://chat.example.com'
    next:
      default: alias
  alias:
    executor: aigentchat://org/agent
    query:
      message: 'hi'
      aigentchat_base_url: '{{ .query.endpoint }}'
    next:
      default: 'null'
query:
  endpoint:
    type: string
output:
  - alias
