aigentflow_version: "2.0.0"
name: invoice_intake
display_name: "Invoice intake"
description: "Reads a pasted supplier invoice and returns vendor, total and currency."
version: "1.0.0"
start: extract
input_schema:
  version: 1
  fields:
    - { name: scan, type: file, label: "Scan", accept: ["application/pdf"] }
    - { name: invoice_text, type: multiline, label: "Invoice text", required: true, max_length: 20000 }
    - { name: currency_hint, type: enum, label: "Expected currency", enum: [EUR, USD, CHF], default: EUR }
    - { name: crm_token, type: secret, label: "CRM token" }
output: [vendor, total, currency]
steps:
  extract:
    executor: "ai://anthropic/chat"
    query:
      model: "claude-sonnet-5-5"
      messages:
        - role: user
          content: "Extract vendor, total and currency from: {{ .query.invoice_text }}"
      response_schema:
        type: object
        additionalProperties: false
        properties:
          vendor: { type: string }
          total: { type: number }
          currency: { type: string }
        required: [vendor, total, currency]
    post_processing:
      - data.set:
          vendor: "{{ .step.response.content.vendor }}"
    next:
      default: "finish"
  finish:
    executor: "ai://anthropic/chat"
    query:
      model: "claude-sonnet-5-5"
      messages:
        - role: user
          content: "Summarise {{ .data.vendor }}"
    post_processing:
      - output.set:
          vendor: "{{ .data.vendor }}"
    next:
      default: "null"
examples:
  - id: standard_eur_invoice
    title: "A normal German invoice"
    guidance: "Our most common case. The total must be the GROSS amount."
    input:
      invoice_text: "Mueller GmbH Gesamtbetrag 1.190,00 EUR"
      currency_hint: EUR
    expected:
      fields:
        total: { approx: 1190.0, tolerance: 0.005 }
        currency: { equals: EUR }
      rubric: "The vendor is spelled as printed."
    tags: [happy-path, german]
    weight: 2
    min_score: 0.7
    side_effects: refuse
    variants:
      - id: english_version
        title: "The same invoice in English"
        origin: author
        input_patch:
          invoice_text: "Mueller GmbH total amount 1,190.00 EUR"
      - id: smudged_total
        origin: author
        input_patch:
          invoice_text: "Mueller GmbH Gesamtbetrag 1.1#0,00 EUR"
        expected:
          status: paused_for_human
      - id: swapped_decimal_marks
        origin: synthetic
        provenance: "generated by swapping the decimal and thousands separators"
        input_patch:
          invoice_text: "Mueller GmbH Gesamtbetrag 1,190.00 EUR"
          crm_token: null
        expected:
          fields:
            total: { approx: 1190.0, tolerance: 0.005 }
  - id: not_an_invoice
    title: "A text that is not an invoice"
    guidance: "A recipe must be refused, never turned into an invoice."
    hold_out: true
    input:
      invoice_text: "Mix two eggs with 200 g of flour."
    expected:
      status: failed
