aigentflow_version: "2.0.0"
name: invoice_intake
display_name: "Invoice intake"
description: "Reads a pasted supplier invoice and returns vendor, total and currency."
version: "1.0.0"
start: extract
input_schema:
  version: 1
  fields:
    - { name: scan, type: file, label: "Scan", accept: ["application/pdf"] }
    - { name: invoice_text, type: multiline, label: "Invoice text", required: true, max_length: 20000 }
    - { name: currency_hint, type: enum, label: "Expected currency", enum: [EUR, USD, CHF], default: EUR }
    - { name: crm_token, type: secret, label: "CRM token" }
output: [vendor, total, currency]
steps:
  extract:
    executor: "ai://anthropic/chat"
    query:
      model: "claude-sonnet-5-5"
      messages:
        - role: user
          content: "Extract vendor, total and currency from: {{ .query.invoice_text }}"
      response_schema:
        type: object
        additionalProperties: false
        properties:
          vendor: { type: string }
          total: { type: number }
          currency: { type: string }
        required: [vendor, total, currency]
    post_processing:
      - data.set:
          vendor: "{{ .step.response.content.vendor }}"
    next:
      default: "finish"
  finish:
    executor: "ai://anthropic/chat"
    query:
      model: "claude-sonnet-5-5"
      messages:
        - role: user
          content: "Summarise {{ .data.vendor }}"
    post_processing:
      - output.set:
          vendor: "{{ .data.vendor }}"
    next:
      default: "null"
examples:
  - id: prose_and_hosts
    title: "Ordinary prose and public hosts"
    guidance: "See risk-assessment-for-the-quarterly-report-2025 and the desk-reservation-system-for-all-floors-of-the-office note; a bearer of bad news is not a token."
    input_ref: { url: "https://93.184.216.34/invoices/a.json", sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", media_type: "application/json" }
    expected:
      reference: { ref: { url: "https://docs.example.org/expected.md", sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", media_type: "text/markdown" } }
      rubric: "Matches the reference."
    variants:
      - id: other_file
        origin: author
        input_ref: { url: "https://docs.example.org/b.json", sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
