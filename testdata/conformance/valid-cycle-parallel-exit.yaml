aigentflow_version: '2.0.0'
name: valid-cycle-parallel-exit
version: '1.0.0'
description: >-
  A fan-out inside the cycle is treated as an exit: its branches are not edges the cycle rule follows.
start: a
steps:
  a:
    executor: function://utils/log
    query:
      message: 'a'
    next:
      default: b
  b:
    executor: function://utils/log
    query:
      message: 'b'
    next:
      parallel:
        steps: [p]
        rendezvous: a
  p:
    executor: function://utils/log
    query:
      message: 'p'
output:
  - message
