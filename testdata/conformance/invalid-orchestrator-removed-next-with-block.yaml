aigentflow_version: '2.0.0'
name: invalid-orchestrator-removed-next-with-block
version: '1.0.0'
description: >-
  A block AND a step that yields to it: one orchestrator_removed finding for the
  block (field orchestrator) and one for the step (field steps.work).
start: work
steps:
  work:
    executor: function://utils/log
    query:
      message: 'working'
    next:
      default: orchestrator
orchestrator:
  mode: owner
  exons: |
    ---
    name: monitor
    description: observe only
    type: agent
    execution:
      provider: anthropic
      model: claude-sonnet-4-6
    ---
    {~exons.message role="system"~}observe{~/exons.message~}
output:
  - message
