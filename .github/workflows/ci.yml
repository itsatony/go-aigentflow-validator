name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: gofmt
        run: |
          # Fail on any unformatted file, naming it.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          (cd exonsinspect && go vet ./...)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: golangci-lint (exonsinspect)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: exonsinspect
          args: --config ../.golangci.yml

      - name: test (race)
        run: |
          go test -race -count=1 ./...
          (cd exonsinspect && go test -race -count=1 ./...)

      - name: wasm build
        # A consumer embeds this in a browser WASM bundle, so a stray os/net
        # import must fail here, not at their build.
        run: GOOS=js GOARCH=wasm go build ./...

      - name: tidy check
        run: |
          go mod tidy
          (cd exonsinspect && go mod tidy)
          git diff --exit-code -- go.mod go.sum exonsinspect/go.mod exonsinspect/go.sum
